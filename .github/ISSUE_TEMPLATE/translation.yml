name: 漏翻或错误翻译
about: 报告尚未汉化、翻译不准确或样式异常
labels: translation
body:
  - type: input
    id: app-version
    attributes:
      label: GitHub Copilot App 版本
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: 汉化启动器版本
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 所在页面和操作步骤
      description: 请说明从哪里进入、点击了什么。
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 英文原文或错误翻译
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 请遮盖账号、仓库名、Token、用户消息和私有内容。